<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaid's Infinite Hentai</title>
    <style>
        :root { --main-red: #ff004c; --bg-black: #000; }
        body { background: var(--bg-black); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .header { padding: 25px; text-align: center; border-bottom: 3px solid var(--main-red); box-shadow: 0 0 30px var(--main-red); }
        .video-list { padding: 15px; display: grid; gap: 20px; }
        .v-card { background: #111; border: 1px solid #333; border-radius: 20px; overflow: hidden; position: relative; }
        .v-card img { width: 100%; display: block; filter: contrast(1.2); }
        .play-icon { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; color: var(--main-red); opacity: 0.9; text-shadow: 0 0 20px black; }
        .tag { position: absolute; top: 10px; right: 10px; background: var(--main-red); padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        
        /* مشغل الفضايح الحقيقي */
        #playerOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; }
        iframe { width: 100%; height: 80vh; border: none; }
        .back-btn { padding: 15px; background: var(--main-red); color: white; text-align: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔞 محراب الهنتاي الحقيقي 🔞</h1>
        <p>براءة الشرموطة فكتلك التشفير يا سي زيد</p>
    </div>

    <div class="video-list" id="content">
        </div>

    <div id="playerOverlay">
        <div class="back-btn" onclick="closeMe()">❌ اقفل وارجع لحضن زيد</div>
        <div id="videoInjected"></div>
    </div>

    <script>
        // دي روابط سيرفرات الهنتاي الحقيقية يا نغل
        const database = [
            { t: "سحاق الأنمي الفاجر", s: "https://vidsrc.me/embed/hentai1", i: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=600" },
            { t: "نيـ.ـك طالبات المدرسة", s: "https://vidsrc.me/embed/hentai2", i: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?w=600" }
        ];

        const container = document.getElementById('content');
        database.forEach(v => {
            container.innerHTML += `
                <div class="v-card" onclick="openVid('${v.s}')">
                    <img src="${v.i}">
                    <div class="play-icon">▶</div>
                    <div class="tag">HD 4K</div>
                    <div style="padding:15px;"><h3>${v.t}</h3></div>
                </div>
            `;
        });

        function openVid(url) {
            document.getElementById('videoInjected').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
            document.getElementById('playerOverlay').style.display = 'flex';
        }

        function closeMe() {
            document.getElementById('playerOverlay').style.display = 'none';
            document.getElementById('videoInjected').innerHTML = "";
        }
    </script>
</body>
</html>
